<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preguntas frecuentes CRT1</title>
<style>
  * { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    padding: 12px;
    background: #F0F8F6;
  }
  #crt1-faq-root {
    width: 100%;
    --navy: #3A7D6D;
    --navy-soft: #3C6E9E;
    --sky: #F0F8F6;
    --sky-line: #DCEEE7;
    --teal: #6FCF97;
    --teal-dark: #4FAE79;
    --ink: #1F2937;
    --ink-soft: #5C7A70;
    --paper: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    max-width: 640px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(24,42,77,0.08);
    border: 1px solid var(--sky-line);
    box-sizing: border-box;
  }

  #crt1-faq-root * { box-sizing: border-box; }

  @media (max-width: 480px) {
    body { padding: 6px; }
    .cfq-header { padding: 18px 16px 16px; }
    .cfq-header h1 { font-size: 17px; }
    .cfq-body { padding: 12px; }
    .cfq-chip { font-size: 13px; padding: 8px 12px; }
    .cfq-msg { font-size: 13.5px; max-width: 92%; }
  }

  .cfq-header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 100%);
    color: white;
    padding: 22px 22px 20px;
  }
  .cfq-header .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #C3E8D3;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .cfq-header h1 {
    font-size: 19px;
    margin: 0 0 4px;
    font-weight: 700;
    line-height: 1.3;
  }
  .cfq-header p {
    margin: 0;
    font-size: 13.5px;
    color: #DFF3E9;
    line-height: 1.4;
  }

  .cfq-body {
    background: var(--sky);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .cfq-chips-label {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy-soft);
    padding: 2px 2px 0;
  }

  .cfq-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .cfq-chip {
    background: var(--paper);
    border: 1px solid var(--sky-line);
    color: var(--navy);
    font-size: 13.5px;
    font-weight: 600;
    padding: 9px 13px;
    border-radius: 999px;
    cursor: pointer;
    text-align: left;
    line-height: 1.3;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .cfq-chip:hover { border-color: var(--teal); background: #F2FBF6; }
  .cfq-chip:active { transform: scale(0.97); }

  .cfq-messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 380px;
    overflow-y: auto;
    padding: 4px 2px;
    scroll-behavior: smooth;
  }
  .cfq-messages:empty { display: none; }

  .cfq-msg {
    max-width: 86%;
    padding: 11px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .cfq-msg.user {
    align-self: flex-end;
    background: var(--teal);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .cfq-msg.bot {
    align-self: flex-start;
    background: var(--paper);
    border: 1px solid var(--sky-line);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }

  .cfq-inputbar {
    display: flex;
    gap: 8px;
    background: var(--paper);
    border: 1px solid var(--sky-line);
    border-radius: 14px;
    padding: 6px 6px 6px 14px;
  }
  .cfq-inputbar input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 14.5px;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
  }
  .cfq-inputbar input::placeholder { color: #9AA9BD; }
  .cfq-send {
    background: var(--navy);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .cfq-send:disabled { opacity: 0.5; cursor: default; }
  .cfq-send:hover:not(:disabled) { background: var(--teal-dark); }

  .cfq-footnote {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    padding: 2px 8px 0;
  }
</style>
</head>
<body>

<div id="crt1-faq-root">
  <div class="cfq-header">
    <div class="eyebrow">Comprensión y Redacción de Textos I</div>
    <h1>Preguntas frecuentes del curso</h1>
    <p>Toca una pregunta o escribe la tuya. Respondo al toque, 24/7.</p>
  </div>
  <div class="cfq-body">
    <div class="cfq-chips-label">Las que más preguntan</div>
    <div class="cfq-chips" id="cfq-chips"></div>
    <div class="cfq-messages" id="cfq-messages"></div>
    <div class="cfq-inputbar">
      <input id="cfq-input" type="text" placeholder="Escribe tu pregunta aquí..." />
      <button class="cfq-send" id="cfq-send">Enviar</button>
    </div>
    <div class="cfq-footnote">Si tu pregunta no está en el temario del curso, se enviará directamente a la profesora.</div>
  </div>
</div>

<!-- Formulario oculto para reenviar a la profesora las preguntas que el bot no reconoce -->
<iframe name="cfq-hidden-frame" style="display:none;"></iframe>
<form id="cfq-gform" action="https://docs.google.com/forms/d/e/1FAIpQLSdlk0PVFcehJwEVWZezFhpqr4WoyYh8GmXUZHUZEaBz1Bwafw/formResponse" method="POST" target="cfq-hidden-frame" style="display:none;">
  <input type="text" name="entry.550729940" id="cfq-gform-categoria" />
  <input type="text" name="entry.1085796528" id="cfq-gform-pregunta" />
</form>

<script>
(function() {
  const FAQ = [
    {
      q: "¿El trabajo es obligatoriamente en equipo?",
      a: "No. Puedes trabajar de manera individual o en equipos de hasta cuatro en todas las tareas, salvo el examen final, que es en pareja.",
      keywords: ["equipo", "grupal", "individual", "solo", "pareja", "grupo de trabajo"]
    },
    {
      q: "¿Tenemos clases en vivo, todas las semanas, o son obligatorias las reuniones por Zoom?",
      a: "El curso es asíncrono, así que no hay clases en vivo con horario fijo ni sesiones todas las semanas. Toda la información está en los recursos de cada semana en la plataforma. Lo único que existe son reuniones informativas por Zoom, una semana antes de cada evaluación, y no son obligatorias: si no puedes asistir, la grabación se comparte en los anuncios de UTP+Class.",
      keywords: ["clase", "todas las semanas", "sesion semanal", "hay clase", "vivo", "horario fijo", "asincrono", "asincrónico", "en vivo", "zoom", "obligatoria la reunion", "reunion obligatoria", "tengo que ir a la reunion"]
    },
    {
      q: "No puedo acceder a la grabación o al enlace de la sesión",
      a: "Para ingresar a una reunión debes hacerlo con tus credenciales de la universidad (correo y contraseña). La grabación se publica en los anuncios de la plataforma. Si no la encuentras, o la encuentras pero no puedes ingresar, escribe por el foro de consultas para revisar qué está ocurriendo.",
      keywords: ["grabacion", "no puedo entrar", "enlace no funciona", "no carga", "no accedo", "link de la reunion"]
    },
    {
      q: "¿Por qué tengo cero en esta tarea?",
      a: "Las tareas son de dos tipos: calificadas y no calificadas. Las no calificadas muestran un cero por defecto solo para poder guardar el mensaje de retroalimentación, que es lo importante ahí, así que no te preocupes. Si el cero aparece en una evaluación calificada de las que figuran en el sílabo, ahí sí debes comunicarte por el foro de consultas o el chat.",
      keywords: ["cero", "nota en cero", "por que tengo cero", "calificacion cero"]
    },
    {
      q: "¿Cuál es el link del grupo de WhatsApp?",
      a: "El link del grupo de WhatsApp de tu sección está publicado en la plataforma, en un anuncio antes del inicio de ciclo. Revisa la sección de anuncios.",
      keywords: ["whatsapp", "grupo de whatsapp", "link del grupo"]
    },
    {
      q: "¿Cuándo son las próximas reuniones informativas?",
      a: "Están programadas una semana antes de cada evaluación: semanas 2, 6, 10, 14 y 17, siempre los lunes a las 7:00 p.m. Fechas: 17 de agosto (TA1), 14 de septiembre, 12 de octubre, 9 de noviembre y 30 de noviembre. También puedes revisar el anuncio con el cronograma completo de reuniones en UTP+Class.",
      keywords: ["cuando es la reunion", "proxima reunion", "fecha de la reunion", "cronograma de reuniones"]
    },
    {
      q: "¿Cómo debo nombrar mi archivo?",
      a: "Si es una tarea no calificada: la letra S, el número de semana, guion bajo y tu apellido. Ejemplo: S2_Palacios. Si es una tarea calificada: el nombre de la evaluación, guion bajo y tu apellido (o el apellido de quien lidera el equipo). Ejemplo: TA1_Palacios o PC1_Palacios.",
      keywords: ["nombrar archivo", "nombre del archivo", "como le pongo", "como se llama el archivo"]
    },
    {
      q: "No entregué la tarea a tiempo, ¿puedo enviarla por otro medio?",
      a: "No. Según las disposiciones de la universidad, no se pueden recibir trabajos calificados ni no calificados por medios que no sean los oficiales. Solo se reciben a través de la tarea correspondiente en UTP+Class; no puedo aceptar entregas por chat, correo ni WhatsApp.",
      keywords: ["entregue tarde", "fuera de plazo", "por otro medio", "te lo envio por correo", "atrasado", "no llegue a tiempo"]
    },
    {
      q: "¿Puedo trabajar individual y hacer el examen final en equipo, o debo mantener la misma modalidad?",
      a: "Lo ideal es mantener la misma modalidad de principio a fin: si empezaste individual, termina individual; si empezaste en equipo, termina en equipo. La única excepción es el examen final, que se rinde en pareja, nunca en equipo de cuatro, así hayas trabajado en equipo de cuatro durante todo el curso.",
      keywords: ["examen final en equipo", "cambiar de modalidad", "individual y despues en equipo", "misma modalidad", "sigo individual"]
    },
    {
      q: "¿Cómo encuentro los materiales de consulta?",
      a: "Los materiales están dentro de los recursos de cada semana en la plataforma. No son solo textos: también hay videos y ejercicios interactivos, así que revisa todo el contenido de la semana, no solo el documento principal.",
      keywords: ["materiales de consulta", "donde encuentro los materiales", "donde estan los recursos", "material de lectura"]
    },
    {
      q: "¿Cómo hago la TA1?",
      a: "Primero revisa el material de la semana correspondiente. Luego ubica las fuentes de información y analízalas en función de la pregunta controversial. Si necesitas más apoyo, revisa este video: https://youtu.be/bLeLGIgJ0gI",
      keywords: ["como hago la tarea", "como realizo la tarea", "por donde empiezo la tarea", "como hago la ta1", "como realizo la ta1"]
    },
    {
      q: "¿Cómo veo los anuncios?",
      a: "Ingresa desde una laptop o computadora de escritorio, no desde el celular. Así puedes ver la pantalla completa de la plataforma sin problemas de visualización.",
      keywords: ["ver los anuncios", "como veo los anuncios", "no veo el anuncio", "anuncios no se ve bien"]
    },
    {
      q: "Si no di un examen, ¿cómo recupero?",
      a: "No existe recuperación de exámenes. Según el sílabo, la única excepción es que la nota del examen final puede sustituir la nota de una Práctica Calificada (PC) no rendida o no entregada, y solo una de las dos PC del curso, no ambas.",
      keywords: ["como recupero", "no di el examen", "recuperacion de examen", "examen de rezagados", "falte al examen"]
    },
    {
      q: "¿Se toma asistencia?",
      a: "No. El curso es asíncrono y funciona 24/7, así que no existe asistencia. Lo que se evalúa es la calidad de los productos que entregas, no cuándo ingresas a la plataforma.",
      keywords: ["asistencia", "se toma lista", "se pasa asistencia"]
    },
    {
      q: "¿Cómo ingreso a la plataforma?",
      a: "Ingresa desde la web a class.utp.edu.pe con tus credenciales institucionales. Para temas de contraseña o problemas de acceso técnico, comunícate con el SAE (Servicio de Atención al Estudiante), ya que eso no lo gestiona la docente directamente.",
      keywords: ["como ingreso a la plataforma", "no puedo entrar a la plataforma", "acceso a la plataforma", "contraseña", "olvide mi clave"]
    },
    {
      q: "¿Quién es el docente del curso?",
      a: "Revisa la tarjeta de presentación del curso en la lista de tus cursos dentro de la plataforma: ahí aparece el nombre de tu docente. También puedes verlo en la opción 'Personas', donde aparece con la etiqueta de docente, o en cualquier anuncio del curso, que siempre incluye el nombre y correo del docente.",
      keywords: ["quien es el docente", "quien es mi profesor", "nombre del docente", "quien dicta el curso", "quien es mi profesora"]
    },
    {
      q: "¿Cuál es el tema de la evaluación TA1?",
      a: "El tema es el que aparece en las fuentes de información de la semana 2: ¿Consideras que el Estado peruano enfrenta adecuadamente el avance de la minería ilegal para evitar la degradación ambiental? Sobre eso debes escribir.",
      keywords: ["tema de la ta1", "tema de ta1", "sobre que es la ta1", "mineria ilegal", "tema de la evaluacion ta1", "de que trata la ta1"]
    },
    {
      q: "¿Cuál es el tema de la PC1 o de las demás evaluaciones?",
      a: "Para conocer el tema de las siguientes evaluaciones (PC1, TA2, PC2, examen final), busca las fuentes de información en las actividades de la semana correspondiente a esa evaluación.",
      keywords: ["tema de la pc1", "tema de la pc2", "tema de la ta2", "tema del examen final", "tema de la evaluacion", "cual es el tema", "de que trata la tarea", "de que trata la evaluacion"]
    }
  ];

  const DEFAULT_CATEGORY = "Cómo se lleva a cabo el curso";
  const FALLBACK_TEXT = "Esa pregunta no está en las que tengo registradas todavía. Se la estoy comunicando directamente a tu docente; también puedes escribirle por el foro de consultas de la plataforma.";

  const chipsEl = document.getElementById('cfq-chips');
  const messagesEl = document.getElementById('cfq-messages');
  const inputEl = document.getElementById('cfq-input');
  const sendBtn = document.getElementById('cfq-send');
  const gformCategoria = document.getElementById('cfq-gform-categoria');
  const gformPregunta = document.getElementById('cfq-gform-pregunta');
  const gform = document.getElementById('cfq-gform');

  FAQ.forEach(item => {
    const chip = document.createElement('button');
    chip.className = 'cfq-chip';
    chip.textContent = item.q;
    chip.addEventListener('click', () => askDirect(item.q, item.a));
    chipsEl.appendChild(chip);
  });

  function addMessage(text, sender) {
    const msg = document.createElement('div');
    msg.className = `cfq-msg ${sender}`;
    msg.textContent = text;
    messagesEl.appendChild(msg);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return msg;
  }

  function normalize(str) {
    return str
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function findMatch(userText) {
    const normalizedInput = normalize(userText);
    let best = null;
    let bestScore = 0;
    FAQ.forEach(item => {
      let score = 0;
      item.keywords.forEach(kw => {
        if (normalizedInput.includes(normalize(kw))) score += 1;
      });
      if (score > bestScore) {
        bestScore = score;
        best = item;
      }
    });
    return bestScore > 0 ? best : null;
  }

  function askDirect(question, answer) {
    addMessage(question, 'user');
    addMessage(answer, 'bot');
  }

  function forwardToTeacher(question) {
    gformCategoria.value = DEFAULT_CATEGORY;
    gformPregunta.value = question;
    gform.submit();
  }

  function askFreeform(question) {
    addMessage(question, 'user');
    const match = findMatch(question);
    if (match) {
      addMessage(match.a, 'bot');
    } else {
      addMessage(FALLBACK_TEXT, 'bot');
      forwardToTeacher(question);
    }
  }

  function handleSend() {
    const value = inputEl.value.trim();
    if (!value) return;
    inputEl.value = '';
    askFreeform(value);
  }

  sendBtn.addEventListener('click', handleSend);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') handleSend();
  });
})();
</script>
</body>
</html>
